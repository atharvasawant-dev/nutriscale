; PlatformIO Project Configuration for NutriScale ESP8266 Scale
;
; Target hardware: ESP8266 NodeMCU ESP-12E
;
; Build & Upload:
;   pio run --target upload
; Serial Monitor:
;   pio device monitor

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200

lib_deps =
    bogde/HX711 @ ^0.7.5
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

build_flags =
    -D BEARSSL_SSL_BASIC
